<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 50px;">
    <h2>Create a Secure Account</h2>
    <form method="POST" action="/register">
        <label>Username:</label><br>
        <input type="text" name="username" style="padding: 5px; width: 250px;" required><br><br>
        
        <label>Password:</label><br>
        <input type="password" name="password" style="padding: 5px; width: 250px;" required><br><br>
        
        <button type="submit" style="padding: 5px 15px; cursor: pointer;">Register</button>
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
</body>
</html>
