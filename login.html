<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Login</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 50px;">
    <h2>Secure Login System</h2>
    <form method="POST" action="/login">
        <label>Username:</label><br>
        <input type="text" name="username" style="padding: 5px; width: 250px;" required><br><br>
        
        <label>Password:</label><br>
        <input type="password" name="password" style="padding: 5px; width: 250px;" required><br><br>
        
        <button type="submit" style="padding: 5px 15px; cursor: pointer;">Login</button>
    </form>
    <p>Don't have an account? <a href="/register">Register here</a></p>
</body>
</html>
